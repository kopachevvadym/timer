<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
  <title>Timer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'><circle cx='11' cy='11' r='9' fill='none' stroke='%23111110' stroke-width='2'/><circle cx='11' cy='11' r='3' fill='%232B59FF'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="logo" href="#now" aria-label="Timer — на головну">
        <svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="11" cy="11" r="3" fill="var(--accent)"/></svg>
        <span class="mono">timer</span>
      </a>
      <nav class="tabs" aria-label="Розділи">
        <a href="#now" data-route="now">Зараз</a>
        <a href="#reports" data-route="reports">Звіти</a>
        <a href="#entries" data-route="entries">Записи</a>
        <a href="#projects" data-route="projects">Проєкти</a>
      </nav>
      <a class="logout" href="/cdn-cgi/access/logout" title="Вийти з Cloudflare Access">Вийти</a>
      <button type="button" class="btn primary" data-action="new-timer">+ Таймер</button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <nav class="bottombar" aria-label="Розділи">
    <a href="#now" data-route="now"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4l2.5 2"/></svg>Зараз</a>
    <a href="#reports" data-route="reports"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V9M10 16V4M16 16v-5"/></svg>Звіти</a>
    <button type="button" class="fab" data-action="new-timer" aria-label="Запустити ручний таймер"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12"/></svg></button>
    <a href="#entries" data-route="entries"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h8"/></svg>Записи</a>
    <a href="#projects" data-route="projects"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>Проєкти</a>
  </nav>

  <dialog id="timer-dialog" aria-labelledby="timer-dialog-h">
    <form method="dialog" id="timer-form" class="stack">
      <div class="row between">
        <h2 id="timer-dialog-h">Ручний таймер</h2>
        <button type="button" class="btn icon ghost" data-action="close-dialog" aria-label="Закрити">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2 2 8 8M10 2l-8 8"/></svg>
        </button>
      </div>
      <label class="field">Проєкт
        <select name="project" required></select>
      </label>
      <label class="field" data-new-project hidden>Назва нового проєкту
        <input name="new_project" autocomplete="off" placeholder="напр. Дзвінки з клієнтами" />
      </label>
      <label class="field">Задача
        <select name="task"></select>
      </label>
      <label class="field">Нотатка
        <input name="note" autocomplete="off" placeholder="Що робите" />
      </label>
      <label class="check"><input type="checkbox" name="switch" checked /> Зупинити інші ручні таймери</label>
      <div class="row end">
        <button type="submit" class="btn primary" value="start">Запустити</button>
      </div>
    </form>
  </dialog>

  <dialog id="entry-dialog" aria-labelledby="entry-dialog-h">
    <form method="dialog" id="entry-form" class="stack"></form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
