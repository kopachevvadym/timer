<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
  <title>Timer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'><circle cx='11' cy='11' r='9' fill='none' stroke='%23111110' stroke-width='2'/><circle cx='11' cy='11' r='3' fill='%232B59FF'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="logo" href="#now" aria-label="Timer — на головну" data-en-aria-label="Timer — home">
        <svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle class="core" cx="11" cy="11" r="3" fill="var(--accent)"/></svg>
        <span class="mono">timer</span>
      </a>
      <nav class="tabs" aria-label="Розділи" data-en-aria-label="Sections">
        <a href="#now" data-route="now" data-en="Now">Зараз</a>
        <a href="#reports" data-route="reports" data-en="Reports">Звіти</a>
        <a href="#entries" data-route="entries" data-en="Entries">Записи</a>
        <a href="#projects" data-route="projects" data-en="Projects">Проєкти</a>
      </nav>
      <a class="me" href="#settings" data-route="settings" aria-label="Налаштування й підключення" data-en-aria-label="Settings and connections" hidden><img alt="" width="24" height="24" /><span></span></a>
      <button type="button" class="btn primary" data-action="new-timer" data-en="+ Timer">+ Таймер</button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <nav class="bottombar" aria-label="Розділи" data-en-aria-label="Sections">
    <a href="#now" data-route="now"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4l2.5 2"/></svg><span data-en="Now">Зараз</span></a>
    <a href="#reports" data-route="reports"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V9M10 16V4M16 16v-5"/></svg><span data-en="Reports">Звіти</span></a>
    <button type="button" class="fab" data-action="new-timer" aria-label="Запустити ручний таймер" data-en-aria-label="Start a manual timer"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12"/></svg></button>
    <a href="#entries" data-route="entries"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h8"/></svg><span data-en="Entries">Записи</span></a>
    <a href="#projects" data-route="projects"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg><span data-en="Projects">Проєкти</span></a>
  </nav>

  <dialog id="timer-dialog" aria-labelledby="timer-dialog-h">
    <form method="dialog" id="timer-form" class="stack">
      <div class="row between">
        <h2 id="timer-dialog-h" data-en="Manual timer">Ручний таймер</h2>
        <button type="button" class="btn icon ghost" data-action="close-dialog" aria-label="Закрити" data-en-aria-label="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2 2 8 8M10 2l-8 8"/></svg>
        </button>
      </div>
      <label class="field"><span data-en="Project">Проєкт</span>
        <select name="project" required></select>
      </label>
      <label class="field" data-new-project hidden><span data-en="New project name">Назва нового проєкту</span>
        <input name="new_project" autocomplete="off" placeholder="напр. Дзвінки з клієнтами" data-en-placeholder="e.g. Client calls" />
      </label>
      <label class="field"><span data-en="Task">Задача</span>
        <select name="task"></select>
      </label>
      <label class="field"><span data-en="Note">Нотатка</span>
        <input name="note" autocomplete="off" placeholder="Що робите" data-en-placeholder="What you’re working on" />
      </label>
      <label class="check"><input type="checkbox" name="switch" checked /> <span data-en="Stop other manual timers">Зупинити інші ручні таймери</span></label>
      <div class="row end">
        <button type="submit" class="btn primary" value="start" data-en="Start">Запустити</button>
      </div>
    </form>
  </dialog>

  <dialog id="entry-dialog" aria-labelledby="entry-dialog-h">
    <form method="dialog" id="entry-form" class="stack"></form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
